name: Android APK
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true

      - name: Install Android NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;29.0.13846066"

      - name: Use precompiled Rust artifacts
        run: printf '%s\n' 'use_precompiled_binaries: true' > apps/mobile/cargokit_options.yaml

      - run: flutter pub get
        working-directory: apps/mobile

      - name: Build APK
        working-directory: apps/mobile
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ccpocket-android
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
